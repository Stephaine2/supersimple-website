
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="checkbox" id="flip">

    <label for="flip" class="background">

        <nav class="navbar">
            <h2>Redo.</h2>

            <ul>
                <li>Services</li>
                <li>Featured Work</li>
                <li>Reviews</li>
            </ul>

            <button>Let's Talk</button>
        </nav>

        <h1>Where are you in your journey?</h1>

        <div class="cards">

            <div class="card">
                <div class="card-inner">
                    <div class="card-back">
                        <span>01</span>
                        <h2>Discover</h2>
                    </div>
                    <div class="card-front">
                        <span>01</span>
                        <h2>Going Zero to One</h2>
                        <p>Turn your ideas into something amazing.</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-inner">
                    <div class="card-back">
                        <span>02</span>
                        <h2>Grow</h2>
                    </div>
                    <div class="card-front">
                        <span>02</span>
                        <h2>Scaling from One to N</h2>
                        <p>Grow your ideas and reach new heights.</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-inner">
                    <div class="card-back">
                        <span>03</span>
                        <h2>Create</h2>
                    </div>
                    <div class="card-front">
                        <span>03</span>
                        <h2>Need Quick Solutions</h2>
                        <p>Find creative solutions for your next challenge.</p>
                    </div>
                </div>
            </div>

        </div>

        <p class="hint">CLICK THE BACKGROUND TO FLIP THE CARDS</p>

    </label>

</body>
</html>
